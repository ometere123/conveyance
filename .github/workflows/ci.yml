name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install genlayer-test==0.29.2
      - run: python -m pip install genvm-linter==0.11.0
      # gltest 0.29.2 prefers whatever is already in ~/.cache/gltest-direct and otherwise
      # falls back to the newest genvm release, always fetching the single asset name
      # genvm-universal.tar.xz. Releases after v0.2.16 stopped publishing that asset, so the
      # fallback 404s on a cold runner. Seeding the cache pins resolution to the same SDK the
      # direct tests are developed against locally. The archive is checked against a known
      # SHA-256 first: pinning the tag alone would still trust whatever bytes that URL serves
      # today, and sha256sum -c fails the job rather than running a different SDK in silence.
      - name: Seed GenVM SDK cache (pins gltest to genvm v0.2.16)
        env:
          GENVM_SDK_SHA256: 4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/gltest-direct
          curl -fsSL --retry 3 -o ~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz \
            https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz
          echo "${GENVM_SDK_SHA256}  ${HOME}/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz" \
            | sha256sum -c -
      - run: npm run verify:emdash
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:direct
      - run: python -m py_compile contracts/Conveyance.py
      - run: genvm-lint check contracts/Conveyance.py --json
      - run: npm run build
      - run: python scripts/verify_fixtures.py
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
